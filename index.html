<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<title>CEDA 토론 진행 도구</title>
<meta name="description" content="반대신문식(CEDA) 토론 진행 타이머 · 3대3·4대4 수행평가 순서와 사회자 멘트 · 평촌고 「화법과 언어」 수업용">
<!-- 카카오톡·밴드 등에 링크를 올릴 때 보이는 미리보기 -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://pnbico.github.io/debate-timer/">
<meta property="og:title" content="CEDA 토론 진행 도구">
<meta property="og:description" content="반대신문식(CEDA) 토론 진행 타이머 · 3대3·4대4 수행평가 순서와 사회자 멘트 · 평촌고 「화법과 언어」 수업용">
<meta property="og:image" content="https://pnbico.github.io/debate-timer/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<!-- 탭 아이콘: 찬성(파랑)·반대(빨강) 초시계. 파일 안에 들어 있어 내려받은 파일에서도 보임 -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e1a'/%3E%3Crect x='27' y='4' width='10' height='7' rx='2' fill='%23fbbf24'/%3E%3Cpath d='M32 14a22 22 0 0 0 0 44z' fill='%233b82f6'/%3E%3Cpath d='M32 14a22 22 0 0 1 0 44z' fill='%23ef4444'/%3E%3Ccircle cx='32' cy='36' r='22' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M32 36V22' stroke='%23fff' stroke-width='4.5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='36' r='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="https://pnbico.github.io/debate-timer/icon-180.png">
<!-- 글꼴: Pretendard (SIL 오픈 폰트 라이선스). 화면에 쓰인 글자 조각만 내려받음.
     인터넷이 없거나 막혀 있으면 기기 기본 글꼴(맑은 고딕 등)로 보임 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 스크롤바·숫자 입력칸 등 브라우저 기본 부품도 어두운 색으로 */
  :root {
    color-scheme: dark;
    /* 화면 틀 높이의 1%. 창이 16:9이거나 더 가로로 길면 1vh와 똑같고,
       세로로 길면(화면 반쪽 창·4:3 프로젝터) 틀에 맞춰 줄어들어 잘리지 않음 */
    --u: min(1vh, calc(100vw * 9 / 1600));
  }
  html, body {
    width: 100%; height: 100%;
    background: #0a0e1a;
    color: #fff;
    font-family: 'Pretendard Variable', 'Pretendard', 'Malgun Gothic', sans-serif;
    overflow: hidden;
    user-select: none;
  }
  /* 화면 틀을 창 가운데에 (세로로 긴 창에서는 위아래 가운데) */
  body { display: flex; }
  
  .stage {
    width: 100vw;
    height: 100vh;
    aspect-ratio: 16 / 9;
    max-width: calc(100vh * 2.2);   /* 창이 16:9보다 가로로 길면 최대 2.2:1까지 가로를 다 씀 */
    max-height: calc(100vw * 9 / 16);
    margin: auto;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: calc(1.5 * var(--u)) 2vw;
    gap: calc(1.5 * var(--u));
  }
  
  /* 상단 논제 영역 */
  .topic-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(90deg, rgba(59,130,246,0.15), rgba(239,68,68,0.15));
    border-radius: calc(1 * var(--u));
    padding: calc(1.2 * var(--u)) 2vw;
    border: 1px solid rgba(255,255,255,0.1);
    position: relative;
    gap: 1.5vw;
  }
  .topic-label {
    color: #fbbf24;
    font-weight: 700;
    font-size: calc(2.2 * var(--u));
    letter-spacing: 0.1em;
  }
  .topic-text {
    flex: 1;
    font-size: calc(2.8 * var(--u));
    font-weight: 600;
    text-align: center;
    background: transparent;
    color: #fff;
    border: none;
    outline: none;
    font-family: inherit;
  }
  .topic-text:focus {
    background: rgba(255,255,255,0.05);
    border-radius: calc(0.5 * var(--u));
  }
  .topic-text::placeholder { color: rgba(255,255,255,0.4); font-weight: 500; }

  /* 논제 고르기 */
  .topic-picker { position: relative; flex-shrink: 0; }
  .topic-pick-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4em;
    color: #fbbf24;
    font-weight: 700;
    font-size: max(calc(2.2 * var(--u)), 13px);
    letter-spacing: 0.1em;
    font-family: inherit;
    background: rgba(251,191,36,0.12);
    border: 1px solid rgba(251,191,36,0.45);
    border-radius: calc(0.8 * var(--u));
    padding: calc(0.6 * var(--u)) 0.9vw calc(0.6 * var(--u)) 1.1vw;
    cursor: pointer;
    white-space: nowrap;
  }
  .topic-pick-btn:hover, .topic-pick-btn[aria-expanded="true"] { background: rgba(251,191,36,0.25); }
  .topic-pick-btn .caret { letter-spacing: 0; font-size: 0.8em; transition: transform 0.15s; }
  .topic-pick-btn[aria-expanded="true"] .caret { transform: rotate(180deg); }
  .topic-menu {
    position: absolute;
    top: calc(100% + calc(1 * var(--u)));
    left: 0;
    z-index: 60;
    min-width: max(calc(46 * var(--u)), 320px);
    padding: calc(0.8 * var(--u));
    background: #141a2e;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: calc(1.2 * var(--u));
    box-shadow: 0 calc(1.5 * var(--u)) calc(4 * var(--u)) rgba(0,0,0,0.6);
    display: none;
    flex-direction: column;
    gap: calc(0.3 * var(--u));
  }
  .topic-menu.show { display: flex; }
  .topic-option {
    display: flex;
    align-items: center;
    gap: 0.9em;
    width: 100%;
    text-align: left;
    padding: calc(1.1 * var(--u)) 1.2vw;
    border: none;
    border-radius: calc(0.8 * var(--u));
    background: transparent;
    color: #fff;
    font-family: inherit;
    font-size: max(calc(2 * var(--u)), 13px);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .topic-option:hover, .topic-option:focus-visible { background: rgba(251,191,36,0.15); outline: none; }
  .topic-option .opt-num {
    flex-shrink: 0;
    width: 1.8em; height: 1.8em;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.1);
    color: #fbbf24;
    font-size: 0.8em;
    font-weight: 800;
  }
  .topic-option .opt-check { margin-left: auto; color: #fbbf24; visibility: hidden; padding-left: 1em; }
  .topic-option.active { background: rgba(251,191,36,0.2); }
  .topic-option.active .opt-check { visibility: visible; }
  .topic-option.custom { border-top: 1px solid rgba(255,255,255,0.1); border-radius: 0 0 calc(0.8 * var(--u)) calc(0.8 * var(--u)); margin-top: calc(0.3 * var(--u)); color: #fde68a; }
  .settings-btn {
    background: rgba(251,191,36,0.2);
    border: 1px solid rgba(251,191,36,0.4);
    color: #fbbf24;
    padding: calc(0.8 * var(--u)) 1.5vw;
    border-radius: calc(0.8 * var(--u));
    font-size: calc(1.8 * var(--u));
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .settings-btn:hover { background: rgba(251,191,36,0.3); }
  .settings-btn { font-size: max(calc(1.8 * var(--u)), 12px); }
  .fs-btn { display: inline-flex; align-items: center; gap: 0.5em;
    background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.25); color: #e5e7eb; }
  .fs-btn:hover { background: rgba(255,255,255,0.16); }
  .fs-btn svg { width: 1.1em; height: 1.1em; }
  @media (max-width: 1100px) {
    .topic-bar .btn-label { display: none; }
    .fs-btn { gap: 0; }
  }

  /* 3대3 / 4대4 빠른 전환 */
  .format-toggle {
    display: inline-flex;
    padding: calc(0.4 * var(--u));
    gap: calc(0.4 * var(--u));
    border-radius: calc(1 * var(--u));
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.15);
    flex-shrink: 0;
  }
  .format-btn {
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.7);
    font-family: inherit;
    font-weight: 800;
    font-size: max(calc(1.9 * var(--u)), 12px);
    padding: calc(0.6 * var(--u)) 1.2vw;
    border-radius: calc(0.7 * var(--u));
    cursor: pointer;
    white-space: nowrap;
  }
  .format-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .format-btn.active { background: #fbbf24; color: #0a0e1a; }
  
  /* 메인 영역 */
  .main {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    gap: 2vw;
    align-items: stretch;
  }
  
  .team {
    display: flex;
    flex-direction: column;
    border-radius: calc(1.5 * var(--u));
    padding: calc(2 * var(--u)) 1.5vw;
    border: 3px solid transparent;
    transition: all 0.3s;
    position: relative;
  }
  .team.pro {
    background: linear-gradient(135deg, rgba(37,99,235,0.25), rgba(37,99,235,0.08));
    border-color: rgba(59,130,246,0.4);
  }
  .team.con {
    background: linear-gradient(135deg, rgba(220,38,38,0.25), rgba(220,38,38,0.08));
    border-color: rgba(239,68,68,0.4);
  }
  .team.active {
    border-width: 4px;
    transform: scale(1.02);
    box-shadow: 0 0 calc(4 * var(--u)) currentColor;
  }
  .team.pro.active { border-color: #60a5fa; color: #60a5fa; }
  .team.con.active { border-color: #f87171; color: #f87171; }
  
  .team-name {
    font-size: max(calc(2.6 * var(--u)), 13px);
    font-weight: 700;
    margin-bottom: calc(1.5 * var(--u));
    background: transparent;
    color: #fff;
    border: none;
    outline: none;
    font-family: inherit;
    width: 100%;
  }
  .team-name:focus {
    background: rgba(255,255,255,0.05);
    border-radius: calc(0.5 * var(--u));
    padding: calc(0.3 * var(--u));
  }
  .team-name::placeholder { color: rgba(255,255,255,0.42); font-weight: 600; }
  .team-position {
    font-size: calc(5 * var(--u));
    font-weight: 900;
    margin-bottom: calc(0.6 * var(--u));
    line-height: 1.15;
    text-align: center;
  }

  /* 토론자 슬롯 */
  .slots {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: calc(1.1 * var(--u));
  }
  .slot {
    flex: 1 1 0;
    max-height: calc(15 * var(--u));
    min-height: 0;
    display: flex;
    align-items: center;
    gap: 0.8vw;
    padding: calc(0.8 * var(--u)) 1vw;
    border-radius: calc(1.1 * var(--u));
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
    transition: background 0.25s, border-color 0.25s, transform 0.25s, box-shadow 0.25s;
  }
  .slot-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(0.3 * var(--u)); }
  .slot-title { display: flex; align-items: baseline; gap: 0.6em; color: rgba(255,255,255,0.88); font-weight: 800; font-size: max(calc(2.3 * var(--u)), 13px); white-space: nowrap; }
  .slot-issue { color: rgba(255,255,255,0.5); font-weight: 600; font-size: 0.72em; }
  .slot-roles { color: rgba(255,255,255,0.5); font-weight: 500; font-size: max(calc(1.5 * var(--u)), 10px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-badge {
    flex-shrink: 0;
    visibility: hidden;
    padding: 0.35em 0.8em;
    border-radius: 999px;
    font-weight: 800;
    font-size: max(calc(1.6 * var(--u)), 11px);
    background: #fff;
    white-space: nowrap;
  }
  .slot.on { transform: translateX(0.3vw); }
  .slot.on .slot-title, .slot.on .slot-roles, .slot.on .slot-issue { color: #fff; }
  .slot.on .slot-badge { visibility: visible; }
  .pro .slot.on { background: rgba(37,99,235,0.55); border-color: #93c5fd; box-shadow: 0 0 calc(2.2 * var(--u)) rgba(96,165,250,0.45); }
  .con .slot.on { background: rgba(220,38,38,0.5);  border-color: #fca5a5; box-shadow: 0 0 calc(2.2 * var(--u)) rgba(248,113,113,0.45); }
  .pro .slot-badge { color: #1d4ed8; }
  .con .slot-badge { color: #b91c1c; }
  .pro .team-position { color: #60a5fa; }
  .con .team-position { color: #f87171; }
  
  /* 중앙 타이머 */
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.03);
    border-radius: calc(1.5 * var(--u));
    padding: calc(2 * var(--u));
    position: relative;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .stage-name {
    font-size: calc(3.2 * var(--u));
    font-weight: 700;
    margin-bottom: calc(1 * var(--u));
    color: #fbbf24;
    text-align: center;
  }
  .stage-counter {
    font-size: calc(1.8 * var(--u));
    opacity: 0.6;
    margin-bottom: calc(1.5 * var(--u));
  }
  .timer {
    font-size: calc(18 * var(--u));
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: -0.02em;
    color: #fff;
    transition: color 0.3s;
  }
  .timer.warning { color: #fbbf24; }
  .timer.danger { color: #ef4444; animation: blink 0.5s infinite; }
  /* 일시정지 중: 숫자를 흐리게 (깜빡임도 멈춤) */
  .timer.paused { opacity: 0.35; animation: none; }
  
  @keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  
  .speaker-tag {
    margin-top: calc(1.5 * var(--u));
    padding: calc(0.8 * var(--u)) 2vw;
    border-radius: calc(5 * var(--u));
    font-size: calc(2.2 * var(--u));
    font-weight: 700;
  }
  .speaker-tag.pro { background: #2563eb; }
  .speaker-tag.con { background: #dc2626; }
  .speaker-tag.both { background: #6b7280; }

  /* 사회자 멘트: 시간이 끝나면 다음 단계 안내. 공간은 항상 확보해 두어 화면이 흔들리지 않게 */
  .mc-line {
    margin-top: calc(1.6 * var(--u));
    width: 88%;
    min-height: max(calc(7 * var(--u)), 44px);
    padding: calc(0.9 * var(--u)) 1.4vw;
    border-radius: calc(1 * var(--u));
    font-size: max(calc(1.9 * var(--u)), 12px);
    line-height: 1.45;
    text-align: center;
    word-break: keep-all;
    color: #fde68a;
    background: rgba(251,191,36,0.08);
    border: 1px solid rgba(251,191,36,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    visibility: hidden;
  }
  .mc-line.show { visibility: visible; }
  .mc-line.quiet {
    color: rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.15);
  }
  .mc-line .mc-tag {
    flex-shrink: 0;
    margin-right: 0.8em;
    padding: 0.15em 0.6em;
    border-radius: 0.5em;
    background: #fbbf24;
    color: #0a0e1a;
    font-weight: 800;
    font-size: 0.85em;
  }
  
  /* 하단 진행바 + 컨트롤 */
  /* 아래쪽: 진행 순서 바(위) + 조작 줄(아래) */
  .bottom {
    display: flex;
    flex-direction: column;
    gap: calc(1.2 * var(--u));
    min-width: 0;
  }
  .control-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 2vw;
  }

  /* 단축키 안내 (노란색) */
  .keys {
    grid-column: 1;
    justify-self: start;
    display: flex;
    flex-wrap: wrap;
    gap: calc(0.6 * var(--u)) 1vw;
    color: #fbbf24;
    font-size: max(calc(1.55 * var(--u)), 11px);
    font-weight: 700;
    white-space: nowrap;
  }
  .keys span { display: inline-flex; align-items: center; gap: 0.35em; }
  .keys kbd {
    font-family: inherit;
    font-size: 0.9em;
    font-weight: 800;
    min-width: 1.9em;
    text-align: center;
    padding: 0.1em 0.5em;
    border-radius: 0.45em;
    border: 1px solid rgba(251,191,36,0.7);
    border-bottom-width: 3px;
    background: rgba(251,191,36,0.12);
    color: #fde68a;
  }
  @media (max-width: 1100px) { .keys { display: none; } }

  /* 제작자 정보 (조작 줄 오른쪽 빈칸) */
  .credit {
    grid-column: 3;
    justify-self: end;
    text-align: right;
    font-size: max(calc(1.3 * var(--u)), 10px);
    line-height: 1.4;
    color: rgba(255,255,255,0.5);
    min-width: 0;
    word-break: keep-all;
  }
  .credit .credit-title { color: rgba(255,255,255,0.78); font-weight: 700; }

  
  .progress {
    display: flex;
    gap: 0.5vw;
    background: rgba(255,255,255,0.04);
    padding: calc(1 * var(--u));
    border-radius: calc(1 * var(--u));
    overflow-x: auto;
  }
  /* 얇고 어두운 스크롤바 (윈도우의 흰 기본 스크롤바 대신) */
  .progress, .modal-body { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.28) transparent; }
  .progress::-webkit-scrollbar, .modal-body::-webkit-scrollbar { width: 8px; height: 8px; }
  .progress::-webkit-scrollbar-track, .modal-body::-webkit-scrollbar-track { background: transparent; }
  .progress::-webkit-scrollbar-thumb, .modal-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.28); border-radius: 4px; }
  .step {
    flex: 1;
    min-width: 6.5vw;
    padding: calc(1.1 * var(--u)) 0.6vw;
    border-radius: calc(0.6 * var(--u));
    font-size: max(calc(1.7 * var(--u)), 12px);
    font-weight: 700;
    text-align: center;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.78);
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid transparent;
    border-top: 3px solid transparent;
    line-height: 1.35;
    word-break: keep-all;
  }
  /* 진행 전 단계도 찬/반/양측을 색으로 구분 */
  .step.pro  { background: rgba(37,99,235,0.18);  border-top-color: #60a5fa; color: #dbeafe; }
  .step.con  { background: rgba(220,38,38,0.18);  border-top-color: #f87171; color: #fee2e2; }
  .step.both { background: rgba(139,92,246,0.18); border-top-color: #a78bfa; color: #ede9fe; }
  .step.done { background: rgba(34,197,94,0.22); border-top-color: #22c55e; color: #86efac; }
  .step.current { 
    background: #fbbf24; 
    color: #0a0e1a; 
    border-color: #fff;
    box-shadow: 0 0 calc(2.2 * var(--u)) rgba(251,191,36,0.6);
    transform: translateY(-calc(0.3 * var(--u)));

  .confirm-overlay {

  .confirm-msg .warn-icon { flex-shrink: 0; width: 1.8em; height: 1.8em; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: rgba(239,68,68,0.2); color: #f87171; font-weight: 900; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 0.8vw; }
  .modal-btn.danger-solid { background: #dc2626; color: #fff; }
  .modal-btn.danger-solid:hover { background: #b91c1c; }
  /* 되돌릴 수 있는 확인(단계 이동 등)은 노란색 */

  .confirm-box.calm { border-color: rgba(251,191,36,0.55); }
  .confirm-box.calm .warn-icon { background: rgba(251,191,36,0.2); color: #fbbf24; }
  /* 휴대폰·태블릿: 주소창이 보이는 동안에는 실제로 보이는 높이(dvh)에 맞춤 (아랫부분 잘림 방지).
     PC·크롬북에서는 dvh와 vh가 같아서 변화 없음. dvh를 모르는 옛 브라우저는 위의 vh 그대로 */
  @supports (height: 100dvh) {
    :root { --u: min(1dvh, calc(100vw * 9 / 1600)); }
    .stage { height: 100dvh; max-width: calc(100dvh * 2.2); }
    .modal { height: 88dvh; }
  }
  /* 키가 아주 낮은 화면(휴대폰 가로, 브라우저를 크게 확대한 경우): 글자 최소 크기를 조금 낮추고
     진행 바 칸을 넓혀 줄바꿈을 줄여서, 맨 아래 버튼까지 한 화면에 들어오게. PC·크롬북 보통 화면은 해당 없음 */
  @media (max-height: 480px) {
    .team-name { font-size: max(calc(2.6 * var(--u)), 11px); }
    .slot-title { font-size: max(calc(2.3 * var(--u)), 11px); }
    .slot-roles { font-size: max(calc(1.5 * var(--u)), 9px); }
    .slot-badge { font-size: max(calc(1.6 * var(--u)), 9px); }
    .mc-line { min-height: max(calc(7 * var(--u)), 34px); font-size: max(calc(1.9 * var(--u)), 10.5px); line-height: 1.35; }
    .step { min-width: 7.5vw; font-size: max(calc(1.7 * var(--u)), 11px); line-height: 1.2; }
    .step .step-num { font-size: max(calc(1.3 * var(--u)), 9px); }
    .step .step-dur { font-size: max(calc(1.25 * var(--u)), 9px); }
    .credit { font-size: max(calc(1.3 * var(--u)), 8.5px); line-height: 1.25; }
  }
</style>

      return m[1] + circled(parseInt(m[2], 10)) + ' ' + act.slice(0, 2);
    }
    return n.length > 8 ? n.slice(0, 8) : n;
  }

  function buildProgress() {
    const el = document.getElementById('progress');
    el.innerHTML = '';
    el.scrollLeft = 0;
    lastScrolledStage = null;
    buildSlots();
    if (stages.length === 0) {
      el.innerHTML = '<div style="flex:1;text-align:center;padding:calc(1.5 * var(--u));opacity:0.5;font-size:calc(1.5 * var(--u))">⚙ 설정에서 토론 단계를 추가해주세요</div>';
      return;
    }
    stages.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'step ' + (s.side || '');
      const label = String(s.short || s.name).replace(/([①-⑨])/g, '<span class="cnum">$1</span>');
      div.innerHTML = `<span class="step-num">${stepLabel(i)}</span>${label}<br><span class="step-dur">${fmt(s.sec)}</span>`;
      div.onclick = () => jumpTo(i);
      el.appendChild(div);
    });
  }
  
  // 단계 번호: 안내 자료 번호(no)가 있으면 그것을, 없으면 순번을 표시
  function stepLabel(i) {
    return (stages[i] && stages[i].no) ? stages[i].no : String(i + 1);
  }

  let lastScrolledStage = null;
  function updateProgress() {
    const steps = document.querySelectorAll('.step');
    steps.forEach((step, i) => {
      step.classList.remove('done', 'current');
      if (i < currentStage) step.classList.add('done');
      if (i === currentStage) step.classList.add('current');
    });
    // 단계가 많아 진행바가 넘칠 때, 현재 단계가 보이도록 가운데로 스크롤 (단계가 바뀔 때만)
    if (currentStage !== lastScrolledStage) {
      lastScrolledStage = currentStage;
      const bar = document.getElementById('progress');
      const cur = steps[Math.max(0, currentStage)];
      if (bar && cur && bar.scrollWidth > bar.clientWidth) {
        const barRect = bar.getBoundingClientRect();
        const curRect = cur.getBoundingClientRect();
        const left = bar.scrollLeft + (curRect.left - barRect.left) - (bar.clientWidth - curRect.width) / 2;
        bar.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
      }
    }
  }
  
  // ========== 토론자 슬롯 ==========
  const SIDE_KEY = { '찬성': 'pro', '정부': 'pro', '반대': 'con', '야당': 'con' };

  // 각 측 토론자 수와 토론자별 맡은 순서(입론·교차조사·반론·최후변론)를 단계 목록에서 뽑음
  function slotInfo() {
    const info = { pro: {}, con: {} };
    stages.forEach(st => {
      const p = parseStage(st);
      if (!p || !SIDE_KEY[p.side]) return;
      const d = info[SIDE_KEY[p.side]][p.num] = info[SIDE_KEY[p.side]][p.num] || { roles: [], issue: '' };
      const act = p.act.replace(/\s+/g, '');
      if (!d.roles.includes(act)) d.roles.push(act);
      if (!d.issue && /입론|반론/.test(act) && /^쟁점/.test(p.issue)) d.issue = p.issue;
    });
    return info;
  }

  function buildSlots() {
    const info = slotInfo();
    ['pro', 'con'].forEach(side => {
      const box = document.getElementById(side + 'Slots');
      box.textContent = '';
      Object.keys(info[side]).map(Number).sort((a, b) => a - b).forEach(num => {
        const d = info[side][num];
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.dataset.key = `${side}-${num}`;
        slot.dataset.issue = (d.issue.match(/\d+/) || [''])[0];   // 맡은 쟁점 번호 (예: '1')
        const main = document.createElement('div'); main.className = 'slot-main';
        const title = document.createElement('div'); title.className = 'slot-title';
        title.textContent = `${num}토론자`;
        if (d.issue) { const is = document.createElement('span'); is.className = 'slot-issue'; is.textContent = d.issue; title.appendChild(is); }
        const roles = document.createElement('div'); roles.className = 'slot-roles';
        roles.textContent = d.roles.join(' · ');
        const badge = document.createElement('div'); badge.className = 'slot-badge';
        main.append(title, roles);
        slot.append(main, badge);
        box.appendChild(slot);
      });
    });
  }

  // 지금 단계에서 활성 표시할 슬롯과 표시 글자
  // 입론·반론·최후변론: 발언자 / 교차조사: 질문자 + 상대편 전원 / 상호토론: 모두
  function slotActivity(st) {
    const on = {};
    if (!st) return on;
    const p = parseStage(st);
    const all = side => [...document.querySelectorAll(`#${side}Slots .slot`)].map(el => el.dataset.key);
    if (p && SIDE_KEY[p.side]) {
      const side = SIDE_KEY[p.side], other = side === 'pro' ? 'con' : 'pro';
      if (p.act.includes('교차')) {
        on[`${side}-${p.num}`] = '질문';
        // 교차조사에 쟁점이 정해져 있으면(예: 4대4 '쟁점1·2') 그 쟁점을 맡은 상대만 답변,
        // 쟁점 표시가 없으면 상대편 전원이 답변
        const issues = (p.issue.match(/\d+/g) || []);
        const slotsOther = [...document.querySelectorAll(`#${other}Slots .slot`)];
        const matched = slotsOther.filter(el => issues.includes(el.dataset.issue));
        (issues.length && matched.length ? matched : slotsOther).forEach(el => { on[el.dataset.key] = '답변'; });
      } else {
        on[`${side}-${p.num}`] = '발언';
      }
    } else if (/^(상호토론|자유)/.test(String(st.name || '').trim())) {
      [...all('pro'), ...all('con')].forEach(k => { on[k] = '토론'; });
    }
    return on;
  }

  function updateSlots() {
    const on = currentStage >= 0 ? slotActivity(stages[currentStage]) : {};
    document.querySelectorAll('.slot').forEach(el => {
      const label = on[el.dataset.key];
      el.classList.toggle('on', !!label);
      el.querySelector('.slot-badge').textContent = label || '';
    });
  }

  // ========== 디스플레이 ==========
  function updateDisplay() {
    const timer = document.getElementById('timer');
    const stageName = document.getElementById('stageName');
    const stageCounter = document.getElementById('stageCounter');
    const speakerTag = document.getElementById('speakerTag');
    const teamPro = document.getElementById('teamPro');
    const teamCon = document.getElementById('teamCon');
    
    teamPro.classList.remove('active');
    teamCon.classList.remove('active');
    
    if (currentStage < 0 || stages.length === 0) {
      timer.textContent = '00:00';
      stageName.textContent = stages.length === 0 ? '단계 없음' : '대기 중';
      stageCounter.textContent = stages.length === 0 ? '⚙ 설정에서 토론 단계를 추가하세요' : '시작 버튼을 눌러주세요';
      speakerTag.textContent = '준비';
      speakerTag.className = 'speaker-tag both';
    } else {
      const s = stages[currentStage];
      timer.textContent = fmt(timeLeft);
      stageName.textContent = s.name;
      stageCounter.textContent = s.no
        ? `진행 순서 ${s.no}번 · ${currentStage+1} / ${stages.length} 단계`
        : `${currentStage+1} / ${stages.length} 단계`;
      
      const proName = document.getElementById('proName').value.trim() || '찬성팀';
      const conName = document.getElementById('conName').value.trim() || '반대팀';
      
      if (s.side === 'pro') {
        speakerTag.textContent = `🔵 ${proName} 발언`;
        speakerTag.className = 'speaker-tag pro';
        teamPro.classList.add('active');
      } else if (s.side === 'con') {
        speakerTag.textContent = `🔴 ${conName} 발언`;
        speakerTag.className = 'speaker-tag con';
        teamCon.classList.add('active');
      } else {
        speakerTag.textContent = /^숙의/.test(String(s.name || '').trim()) ? '⚪ 팀별 숙의' : '⚪ 양측 토론';
        speakerTag.className = 'speaker-tag both';
        teamPro.classList.add('active');
        teamCon.classList.add('active');
      }
    }
    
    updateSlots();

    timer.classList.remove('warning', 'danger');
    if (currentStage >= 0 && timeLeft > 0) {
      const plan = alertPlan(stages[currentStage]);
      if (timeLeft <= plan.red) timer.classList.add('danger');
      else if (timeLeft <= plan.yellow) timer.classList.add('warning');
    }
    timer.classList.toggle('paused', isPaused());

    const playBtn = document.getElementById('playBtn');
    if (isRunning) {
      playBtn.textContent = '⏸ 일시정지';
      playBtn.classList.add('paused');
    } else {
      const stageOver = currentStage >= 0 && timeLeft <= 0;
      const isLast = currentStage === stages.length - 1;
      playBtn.textContent = (currentStage < 0 || !stageStarted) ? '▶ 시작'
        : stageOver ? (isLast ? '✓ 완료' : '▶ 다음 단계')
        : '▶ 계속';
      playBtn.classList.remove('paused');
    }

    updateProgress();
    updateWakeLock();
  }
  
  // ========== 남은 시간 알림 ==========
  // 예비음은 노란색으로 바뀔 때 한 번만, 빨간색으로 바뀔 때는 소리 없음
  // 입론·반론: 10초 노란색+예비음, 5초 빨간색
  // 교차조사·상호토론·최후변론: 20초 노란색+예비음, 10초 빨간색
  // 숙의: 20초 노란색, 10초 빨간색 (예비음 없음)
  // 그 밖의 단계: 30초 노란색+예비음, 10초 빨간색
  function alertPlan(stage) {
    const name = String((stage && stage.name) || '');
    if (/입론|반론/.test(name)) return { yellow: 10, red: 5, beeps: [10] };
    if (/숙의/.test(name)) return { yellow: 20, red: 10, beeps: [] };
    if (/교차|상호토론|자유|최후|최종/.test(name)) return { yellow: 20, red: 10, beeps: [20] };
    return { yellow: 30, red: 10, beeps: [30] };
  }

  // ========== 단계 제어 ==========
  // 단계를 불러와 대기 화면으로 둠 (시간은 흐르지 않음, 그 차례 안내 멘트 표시)
  function startStage(idx) {
    stopTimer();
    currentStage = idx;
    timeLeft = stages[idx].sec;
    remainMs = timeLeft * 1000;
    stageStarted = false;
    showStandby();
    updateDisplay();
  }

  // 토론 시작 전(대기) 상태로
  function goToOpening() {
    stopTimer();
    currentStage = -1;
    timeLeft = 0;
    remainMs = 0;
    stageStarted = false;
    showOpening();
    updateDisplay();
  }

  // 차례 도중에 멈춰 있는 상태
  function isPaused() {
    return currentStage >= 0 && !isRunning && timeLeft > 0 && stageStarted;
  }

  // 일시정지: 숫자를 흐리게 하고 멘트 칸에 안내
  function pauseTimer() {
    stopTimer();
    if (isPaused()) setMc('⏸ 일시정지 중입니다. 스페이스나 ▶ 계속을 누르면 이어서 진행합니다.', true);
  }

  function togglePlay() {
    if (stages.length === 0) {
      toast('토론 단계가 없습니다. ⚙ 설정에서 단계를 추가해 주세요.', 'warn');
      return;
    }
    if (currentStage < 0) {
      startStage(0);
      startTimer();
    } else if (isRunning) {
      pauseTimer();
    } else if (timeLeft <= 0) {
      // 시간이 끝난 단계: 다음 차례 대기 화면으로 넘어감 (한 번 더 눌러야 시작)
      if (currentStage < stages.length - 1) startStage(currentStage + 1);
    } else {
      startTimer();
    }
  }

  // 다음 숫자로 바뀌는 순간에 소리가 정확히 맞도록, 그 순간을 실제 시계로 계산해 미리 예약
  function scheduleNextSecond() {
    if (currentStage < 0 || timeLeft <= 0) return;
    const next = timeLeft - 1;
    const inSec = Math.max(0, (endAt - next * 1000 - performance.now()) / 1000);
    if (alertPlan(stages[currentStage]).beeps.includes(next)) playCue(WARNING_CUE, inSec);
    if (next === 0) playCue(END_CUE, inSec);
  }

  // 다음 숫자가 바뀌는 시각에 맞춰 깨어남. 늦게 깨어나도 실제 시계로 다시 계산하므로 시간이 밀리지 않음
  function armTick() {
    clearTimeout(tickTimer);
    const rem = endAt - performance.now();
    const untilChange = rem - (Math.ceil(rem / 1000) - 1) * 1000;
    tickTimer = setTimeout(tick, Math.max(0, untilChange) + 15);
  }

  function tick() {
    if (!isRunning) return;
    const left = Math.max(0, Math.ceil((endAt - performance.now()) / 1000));
    if (left !== timeLeft) {
      timeLeft = left;
      if (timeLeft <= 0) {
        remainMs = 0;
        stopTimer(true);   // 시간이 다 된 경우: 이미 울리기 시작한 종료음은 그대로 둠
        showTimeUp();
        return;
      }
      scheduleNextSecond();
      updateDisplay();
    }
    armTick();
  }

  function startTimer() {
    if (currentStage < 0 || timeLeft <= 0) return;
    hideMc();
    // 남은 밀리초가 화면 숫자와 어긋나 있으면(단계를 새로 불러온 경우 등) 화면 숫자 기준으로 맞춤
    if (!(remainMs > 0) || Math.ceil(remainMs / 1000) !== timeLeft) remainMs = timeLeft * 1000;
    endAt = performance.now() + remainMs;
    isRunning = true;
    stageStarted = true;
    scheduleNextSecond();
    armTick();
    updateDisplay();
  }

  // timeUp: 시간이 다 되어 멈춘 경우(true). 일시정지·단계 이동이면 예약해 둔 소리를 취소
  function stopTimer(timeUp) {
    if (isRunning && timeUp !== true) {
      // 멈춘 순간의 남은 시간을 밀리초까지 기억 (다시 시작하면 그대로 이어짐)
      remainMs = Math.max(1, endAt - performance.now());
      timeLeft = Math.ceil(remainMs / 1000);
    }
    isRunning = false;
    clearTimeout(tickTimer); tickTimer = null;
    if (timeUp !== true) cancelCues();
    updateDisplay();
  }

  // 다른 탭·창에 가려져 있다가 돌아오면 바로 다시 계산 (가려진 동안 브라우저가 타이머를 늦게 깨우는 경우 대비)
  document.addEventListener('visibilitychange', () => { if (!document.hidden && isRunning) tick(); });

  function nextStage() {
    if (stages.length === 0) return;
    if (currentStage < stages.length - 1) {
      startStage(currentStage + 1);
    } else if (currentStage === stages.length - 1) {
      if (timeLeft > 0) askConfirm('마지막 순서입니다. 여기서 토론을 마칠까요?', finishDebate, { ok: '마치기' });
      else toast('모든 토론 순서가 끝났습니다.', 'ok');
    }
  }

  // 마지막 순서를 시간 전에 끝냄: 0:00으로 두고 마무리 멘트
  function finishDebate() {
    stopTimer();
    timeLeft = 0;
    remainMs = 0;
    setMc(mcScript(stages.length).text);
    updateDisplay();
  }

  function prevStage() {
    if (stages.length === 0) return;
    if (currentStage > 0) {
      startStage(currentStage - 1);
    } else if (currentStage === 0) {
      goToOpening();
    }
  }

  function jumpTo(idx) {
    askConfirm(`${stepLabel(idx)}번 "${stages[idx].name}"(으)로 이동하시겠습니까?`, () => startStage(idx), { ok: '이동' });
  }

  // '처음부터': 토론 시작 전으로 되돌림
  function resetAll() {
    askConfirm('토론 시작 전으로 되돌릴까요? 지금까지의 진행 상황은 사라집니다.', goToOpening, { ok: '처음부터', danger: true });
  }

  // ========== 확인 창 ==========
  // 브라우저 기본 확인 창(confirm)은 뜨는 순간 전체화면이 풀리고 떠 있는 동안 타이머 화면이 멈춤 → 앱 안의 창을 씀
  // opt.danger: 되돌릴 수 없는 일(빨간 버튼, 처음 포커스는 '취소') / 아니면 노란 버튼, 처음 포커스는 실행 버튼
  let confirmAction = null;
  function askConfirm(msg, onOk, opt = {}) {
    const box = document.getElementById('confirmBox');
    const ok = document.getElementById('confirmOk');
    document.getElementById('confirmMsg').textContent = msg;
    ok.textContent = opt.ok || '확인';
    ok.className = 'modal-btn ' + (opt.danger ? 'danger-solid' : 'go');
    box.querySelector('.confirm-box').classList.toggle('calm', !opt.danger);
    box.querySelector('.warn-icon').textContent = opt.danger ? '!' : '?';
    confirmAction = onOk;
    box.hidden = false;
    (opt.danger ? document.getElementById('confirmCancel') : ok).focus();
  }
  function closeConfirm(yes) {
    document.getElementById('confirmBox').hidden = true;
    const act = confirmAction;
    confirmAction = null;
    if (yes && act) act();
  }
  function isConfirmOpen() {
    return !document.getElementById('confirmBox').hidden;
  }
  
  // ========== 사회자 멘트 ==========
  // 시간 표기는 '-분-초' (예: 50초, 1분 40초, 3분)
  function fmtKor(sec) {
    const m = Math.floor(sec / 60), s = sec % 60;
    if (m && s) return `${m}분 ${s}초`;
    return m ? `${m}분` : `${s}초`;
  }

  const QUIET_MC = '(사회자 멘트 없이 차례대로 진행)';

  // '찬성 1토론자 입론 (쟁점1)' → { side: '찬성', num: '1', act: '입론', issue: '쟁점1' }
  function parseStage(st) {
    const name = String((st && st.name) || '').trim();
    const m = name.match(/^(찬성|반대|정부|야당)\s*(\d+)\s*(?:번|토론자)\s*(.+?)\s*(?:\(([^)]*)\))?$/);
    return m ? { side: m[1], num: m[2], act: m[3], issue: m[4] || '' } : null;
  }

  // 토론자별로 나눠 재는 입론·반론 단계 (진행 순서 번호가 1-1, 1-2 …처럼 붙은 단계)
  function isSplit(st) {
    return !!(st && st.no && String(st.no).includes('-'));
  }

  // idx번째 차례의 대기 화면에 띄울 안내 멘트 → { text, quiet }
  // (idx가 범위를 넘으면 마무리 멘트, quiet이면 멘트 없이 진행한다는 안내)
  function mcScript(idx) {
    if (idx >= stages.length) return { text: '이상으로 모든 토론 순서를 마치겠습니다. 수고 많으셨습니다.' };
    const s = stages[idx], prev = stages[idx - 1];
    const t = fmtKor(s.sec);
    const plain = String(s.name || '').trim().replace(/\s*\([^)]*\)\s*$/, '');
    const cur = parseStage(s), before = parseStage(prev);

    // 같은 측 안에서 입론끼리, 반론끼리 이어지는 토론자 사이: 멘트 없이 차례대로 진행
    // (찬성 → 반대처럼 측이 바뀌면 아래에서 그 측 입론·반론 전체를 안내)
    if (isSplit(s) && isSplit(prev) && cur && before && cur.act === before.act && cur.side === before.side) {
      return { text: QUIET_MC, quiet: true };
    }

    let next;
    if (isSplit(s) && cur) {
      // 입론·반론 묶음의 첫 토론자: 그 측 전체를 한 번에 안내
      next = `다음은 ${cur.side} 측 ${cur.act}입니다. ${cur.num}토론자부터 차례대로 ${t}씩 발언해 주세요.`;
    } else if (cur) {
      const about = cur.issue ? `${cur.issue}에 대해 ` : '';
      const verb = cur.act.includes('교차') ? '실시해' : '발언해';
      next = `다음은 ${cur.side} 측 ${cur.num}토론자의 ${cur.act}입니다. ${about}${t} 동안 ${verb} 주십시오.`;
    } else if (plain.startsWith('숙의')) {
      next = `다음은 숙의 시간입니다. 양 팀은 ${t} 동안 협의해 주십시오.`;
    } else if (plain.startsWith('상호토론') || plain.startsWith('자유')) {
      next = `다음은 ${plain}입니다. 양측은 ${t} 동안 자유롭게 발언해 주십시오.`;
    } else if (s.side === 'pro' || s.side === 'con') {
      next = `다음은 ${plain}입니다. ${t} 동안 ${plain.includes('교차') ? '실시해' : '발언해'} 주십시오.`;
    } else {
      next = `다음은 ${plain} 순서입니다. ${t} 동안 진행하겠습니다.`;
    }
    return { text: next };
  }

  // 토론 시작 전 멘트 (논제 칸 내용과 동기화)
  const TOPIC_PLACEHOLDER = '논제를 입력하세요 (클릭하여 수정)';
  function openingScript() {
    const raw = document.getElementById('topicInput').value.trim();
    // 논제를 아직 안 적었으면 논제 부분을 빼고, 앞뒤에 따옴표를 직접 적었으면 겹치지 않게 정리
    const topic = (raw && raw !== TOPIC_PLACEHOLDER) ? raw.replace(/^['"‘’“”]+|['"‘’“”]+$/g, '').trim() : '';
    const head = topic
      ? `지금부터 ‘${topic}’에 대한 토론을 시작하겠습니다.`
      : '지금부터 토론을 시작하겠습니다.';
    // 첫 단계가 토론자별로 나눈 입론이면 순서·시간 안내를 덧붙임
    const first = stages[0], fp = parseStage(first);
    const tail = (isSplit(first) && fp)
      ? ` ${fp.num}토론자부터 차례대로 ${fmtKor(first.sec)}씩 발언해 주세요.`
      : '';
    return head + ' 찬성 측부터 입론을 시작해주세요.' + tail;
  }

  function setMc(text, quiet) {
    const el = document.getElementById('mcLine');
    el.textContent = '';

      const tag = document.createElement('span');
      tag.className = 'mc-tag';
      tag.textContent = '사회자';

  // 0:00이 되었을 때: '시간이 다 되었습니다.'만 (마지막 순서면 마무리 인사까지)
  function showTimeUp() {
    const last = currentStage >= stages.length - 1;
    setMc('시간이 다 되었습니다.' + (last ? ' ' + mcScript(stages.length).text : ''));
  }

  // 다음 차례 대기 화면: 그 차례 안내 멘트 (스페이스·계속을 누르면 시작)
  function showStandby() {

    setMc(r.text, r.quiet);
  }

  // 시작 전(대기 상태)일 때: 토론 시작 멘트
  function showOpening() {
    if (stages.length === 0) { hideMc(); return; }
    setMc(openingScript());

  function hideMc() {
    const el = document.getElementById('mcLine');
    el.classList.remove('show', 'quiet');

  // ========== 3대3 / 4대4 빠른 전환 ==========
  function applyPreset(key) {
    stopTimer();
    stages = JSON.parse(JSON.stringify(presets[key].stages));
    activePresetKey = key;
    currentStage = -1;
    timeLeft = 0;
    showOpening();
    markUnsaved();
    buildProgress();
    updateDisplay();
    updateFormatToggle();

  function switchFormat(key) {

    if (currentStage >= 0) {
      askConfirm(`진행 중인 토론을 처음으로 되돌리고 ${label} 토론으로 바꿀까요?`, () => applyPreset(key), { ok: '바꾸기', danger: true });

  // ========== 전체화면 ==========
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function toggleFullscreen() {
    const d = document, el = d.documentElement;
    try {
      const r = isFullscreen()
        ? (d.exitFullscreen || d.webkitExitFullscreen).call(d)
        : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      if (r && r.catch) r.catch(() => {});
    } catch (e) {}
  }
  function updateFsBtn() {

  }
  document.addEventListener('fullscreenchange', () => { updateFsBtn(); setTimeout(fitTopic, 50); });
  document.addEventListener('webkitfullscreenchange', () => { updateFsBtn(); setTimeout(fitTopic, 50); });
  // 전체화면을 지원하지 않는 브라우저(예: 아이폰 사파리)에서는 버튼을 숨김
  if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) {
    document.getElementById('fsBtn').style.display = 'none';
  }

  // ========== 사운드 ==========
  let audioCtx = null;
  let keepAlive = null;

  // 소리 엔진은 사용자가 화면을 누르거나 키를 누르는 순간 미리 켜 둠
  // (사파리처럼 사용자 조작 없이 켠 소리를 막는 브라우저가 있음)
  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      startKeepAlive();
    } catch (e) {}
  }
  ['pointerdown', 'keydown', 'touchend'].forEach(ev =>
    document.addEventListener(ev, ensureAudio, { capture: true, passive: true }));

  // 크롬 계열 브라우저는 소리가 30초 동안 완전히 0(무음)이면 스피커 출력을 쉬게 했다가,
  // 다음 소리가 나올 때 다시 켜면서 그 소리를 늦게 내보냄 → 신호음이 1초쯤 늦게 들림.
  // 사람 귀에는 들리지 않는 아주 작은 신호(-74dB, 50Hz)를 계속 흘려서 출력이 쉬지 않게 함.
  function startKeepAlive() {
    if (keepAlive || !audioCtx) return;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.frequency.value = 50;
    g.gain.value = 0.0002;
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start();
    keepAlive = osc;
  }

  // 효과음 음색 — 배음 [배수, 크기, 울림 비율]
  // 마림바: 높은 배음이 먼저 사라져 나무 건반처럼 들림 / 종소리: 맑은 기본음 + 옅은 배음
  const MARIMBA = [[1, 1, 1], [4, 0.1, 0.3], [10, 0.015, 0.12]];
  const BELL = [[1, 1, 1], [2, 0.16, 1], [3, 0.04, 1]];
  // 예비음(30초·10초 남음): 마림바 '톡' 한 음(라). 음이 올라가지 않아 끝난 느낌이 들지 않음
  const WARNING_CUE = { notes: [[880, 0]], vol: 0.42, decay: 0.9, attack: 0.004, partials: MARIMBA };
  // 종료음: 도-미-솔-도로 올라가며 마무리
  const END_CUE = { notes: [[523.25, 0], [659.25, 0.17], [783.99, 0.34], [1046.5, 0.51]], vol: 0.3, decay: 1.5, attack: 0.012, partials: BELL };

  let pendingCues = [];   // 예약해 둔 소리 (일시정지·단계 이동 시 아직 안 울린 것만 취소)

  function chimeNote(freq, at, cue) {
    cue.partials.forEach(([mult, amp, ratio]) => {
      const len = cue.decay * ratio;
      const o = audioCtx.createOscillator(), env = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = freq * mult;
      env.gain.setValueAtTime(0.0001, at);
      env.gain.linearRampToValueAtTime(cue.vol * amp, at + cue.attack);
      env.gain.exponentialRampToValueAtTime(0.0001, at + len);
      o.connect(env);
      env.connect(audioCtx.destination);
      o.start(at);
      o.stop(at + len + 0.05);
      pendingCues.push({ env, at });
    });
  }

  // inSec초 뒤(스피커 출력 지연만큼 당겨서)에 효과음을 울림
  function playCue(cue, inSec = 0) {
    ensureAudio();
    if (!audioCtx) return;
    const go = () => {
      try {
        const lag = (audioCtx.outputLatency || 0) + (audioCtx.baseLatency || 0);
        const at = audioCtx.currentTime + Math.max(0.02, inSec - lag);
        pendingCues = pendingCues.filter(c => c.at > audioCtx.currentTime - 3);
        cue.notes.forEach(([f, dt]) => chimeNote(f, at + dt, cue));
      } catch (e) {}
    };
    if (audioCtx.state === 'running') go();
    else audioCtx.resume().then(go).catch(() => {});
  }

  function cancelCues() {
    if (!audioCtx) { pendingCues = []; return; }
    const now = audioCtx.currentTime;
    // 아직 울리지 않은 소리는 스피커 연결을 끊어 확실히 막음
    pendingCues.forEach(c => { if (c.at > now) { try { c.env.disconnect(); } catch (e) {} } });
    pendingCues = pendingCues.filter(c => c.at <= now);
  }
  
  // ========== 설정 모달 ==========
  function openSettings() {
    if (isRunning) pauseTimer();
    
    // 현재 상태를 모달에 복사 (설정 창 안에서 고르는 프리셋은 '적용'해야 실제로 바뀜)
    editingStages = JSON.parse(JSON.stringify(stages));
    editingPresetKey = activePresetKey;

    renderPresets();
    renderStageList();
    document.getElementById('settingsModal').classList.add('show');
  }
  
  function closeSettings() {
    document.getElementById('settingsModal').classList.remove('show');
  }
  
  function renderPresets() {
    const grid = document.getElementById('presetGrid');
    grid.innerHTML = '';
    Object.entries(presets).forEach(([key, p]) => {
      const btn = document.createElement('button');
      btn.className = 'preset-btn' + (key === editingPresetKey ? ' active' : '');
      btn.innerHTML = `<div class="preset-name">${p.name}</div><div class="preset-desc">${p.desc}</div>`;
      btn.onclick = () => loadPreset(key);
      grid.appendChild(btn);
    });
  }
  
  let activePresetKey = DEFAULT_PRESET;   // 지금 화면에 쓰는 프리셋
  let editingPresetKey = DEFAULT_PRESET;  // 설정 창에서 골라 둔 프리셋 ('취소'하면 버려짐)
  function loadPreset(key) {
    const p = presets[key];
    editingStages = JSON.parse(JSON.stringify(p.stages));
    editingPresetKey = key;
    renderPresets();
    renderStageList();
    // 시각적 피드백
    const toast = document.getElementById('presetToast');
    toast.textContent = `✓ "${p.name}" 프리셋을 불러왔습니다`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }
  
  function renderStageList() {
    const list = document.getElementById('stageList');
    list.innerHTML = '';
    editingStages.forEach((s, i) => {
      const min = Math.floor(s.sec / 60);
      const sec = s.sec % 60;
      const row = document.createElement('div');
      row.className = 'stage-row';
      row.innerHTML = `
        <div class="stage-num">${i+1}</div>
        <input type="text" value="${s.name}" placeholder="단계 이름" oninput="updateStage(${i},'name',this.value)" />
        <input type="number" min="0" max="60" value="${min}" oninput="updateStageTime(${i},'min',this.value)" />
        <input type="number" min="0" max="59" value="${sec}" oninput="updateStageTime(${i},'sec',this.value)" />
        <select class="${s.side}" onchange="updateStage(${i},'side',this.value); this.className=this.value;">
          <option value="pro" ${s.side==='pro'?'selected':''}>찬성</option>
          <option value="con" ${s.side==='con'?'selected':''}>반대</option>
          <option value="both" ${s.side==='both'?'selected':''}>양측</option>
        </select>
        <button class="delete-btn" onclick="deleteStage(${i})">✕</button>
      `;
      list.appendChild(row);
    });
    updateTotalTime();
  }
  
  function updateStage(idx, field, value) {
    editingStages[idx][field] = value;
    if (field === 'name') {
      editingStages[idx].short = makeShort(value);
    }
  }
  
  function updateStageTime(idx, unit, value) {
    const v = parseInt(value) || 0;
    const cur = editingStages[idx].sec;
    if (unit === 'min') {
      editingStages[idx].sec = v * 60 + (cur % 60);
    } else {
      editingStages[idx].sec = Math.floor(cur / 60) * 60 + Math.min(59, v);
    }
    updateTotalTime();
  }
  
  function deleteStage(idx) {
    editingStages.splice(idx, 1);
    renderStageList();
  }
  
  function addStage() {
    editingStages.push({ name: '새 단계', sec: 180, side: 'pro', short: '새 단계' });
    renderStageList();
  }
  
  function updateTotalTime() {
    const total = editingStages.reduce((sum, s) => sum + s.sec, 0);
    const min = Math.floor(total / 60);
    const sec = total % 60;
    document.getElementById('totalTime').textContent = 
      `📊 ${editingStages.length}개 단계 · 총 발언시간 ${min}분 ${sec}초`;
  }
  
  // '적용': 불러오거나 고친 단계를 메인 화면에 적용하고 설정 창을 닫음 (성공하면 true)
  function applySettings() {
    // 유효성 검사
    for (const s of editingStages) {
      if (!s.name.trim()) { toast('단계 이름을 모두 입력해 주세요.', 'warn'); return false; }
      if (s.sec <= 0) { toast(`"${s.name}" 단계의 시간을 1초 이상으로 정해 주세요.`, 'warn'); return false; }
    }
    
    stages = JSON.parse(JSON.stringify(editingStages));
    // 고친 내용을 그 프리셋 자체에 반영 (3대3/4대4 버튼, 내려받기·파일 저장에도 쓰임)
    activePresetKey = editingPresetKey;
    if (presets[activePresetKey]) presets[activePresetKey].stages = JSON.parse(JSON.stringify(editingStages));
    
    currentStage = -1;
    timeLeft = 0;
    showOpening();
    
    buildProgress();
    updateDisplay();
    updateFormatToggle();
    closeSettings();
    markUnsaved();
    return true;
  }

  // '내려받기'(내려받은 파일에서는 '파일에 저장'): 적용한 뒤 그 설정이 담긴 파일로 저장
  function downloadFromSettings() {
    if (!applySettings()) return;
    fileButton();
  }

  // '초기화': 프리셋·논제·팀 이름 등 모든 설정을 웹 페이지 처음 상태로
  function openResetConfirm() {
    askConfirm('가장 처음의 설정으로 돌아갑니다.', resetAllSettings, { ok: '확인', danger: true });
  }
  function resetAllSettings() {
    stopTimer();
    Object.keys(presets).forEach(k => { delete presets[k]; });
    Object.assign(presets, JSON.parse(JSON.stringify(ORIGINAL_PRESETS)));
    document.getElementById('topicInput').value = '';
    document.getElementById('proName').value = '';
    document.getElementById('conName').value = '';
    activePresetKey = 'perf33';
    stages = JSON.parse(JSON.stringify(presets.perf33.stages));
    currentStage = -1;
    timeLeft = 0;
    showOpening();
    buildProgress();
    updateDisplay();
    updateFormatToggle();
    fitTopic();
    closeSettings();
    markUnsaved();
    toast(IS_LOCAL_FILE
      ? '처음 설정으로 되돌렸어요. 이 파일에도 남기려면 💾 저장을 누르세요.'
      : '처음 설정으로 되돌렸어요.', 'ok');
  }
  
  // ========== 내려받기 / 파일에 저장 ==========
  function toast(msg, kind) {
    const el = document.getElementById('appToast');
    el.textContent = msg;
    el.className = 'app-toast show' + (kind ? ' ' + kind : '');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove('show'), 3200);
  }

  // 지금 설정(프리셋·마지막 프리셋·논제·팀 이름)을 담은 HTML 문서를 만듦
  function buildSavedHtml() {
    const data = {
      v: 1,
      savedAt: new Date().toISOString(),
      active: activePresetKey,
      presets: JSON.parse(JSON.stringify(presets)),
      topic: document.getElementById('topicInput').value,
      proName: document.getElementById('proName').value,
      conName: document.getElementById('conName').value,
    };
    const json = JSON.stringify(data).replace(/</g, '\\u003c');   // 스크립트 안에서 안전하게
    return PAGE_SOURCE.replace(
      /(<script type="application\/json" id="saved-settings">)[\s\S]*?(<\/script>)/,
      (m, open, close) => open + json + close
    );
  }

  const DOWNLOAD_NAME = 'CEDA 토론 진행 도구.html';   // 내려받는 파일 이름 (페이지 제목과 같게)

  function currentFileName() {
    if (IS_LOCAL_FILE) {
      const last = decodeURIComponent(location.pathname.split('/').pop() || '');
      if (/\.html?$/i.test(last)) return last;
    }
    return DOWNLOAD_NAME;
  }

  function downloadFile(html, name) {
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // 내려받은 파일에서: 그 파일 자체에 덮어써서 저장 (크롬·엣지 계열)
  // 지원하지 않는 브라우저(사파리 등)는 새 파일로 내려받음
  let fileHandle = null;
  async function saveToFile() {
    const html = buildSavedHtml();
    if (window.showSaveFilePicker) {
      try {
        if (!fileHandle) {
          fileHandle = await window.showSaveFilePicker({
            suggestedName: currentFileName(),
            types: [{ description: 'HTML 파일', accept: { 'text/html': ['.html'] } }],
          });
        } else if (fileHandle.queryPermission && (await fileHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') {
          if ((await fileHandle.requestPermission({ mode: 'readwrite' })) !== 'granted') throw Object.assign(new Error('denied'), { name: 'NotAllowedError' });
        }
        const w = await fileHandle.createWritable();
        await w.write(html);
        await w.close();
        markSaved();
        toast(`✓ '${fileHandle.name}' 파일에 저장했어요`, 'ok');
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') { toast('저장을 취소했어요. 바꾼 설정은 이 화면에만 적용돼 있어요.', 'warn'); return; }
        fileHandle = null;   // 권한 거부 등: 아래 내려받기로
      }
    }
    downloadFile(html, currentFileName());
    markSaved();
    toast('이 브라우저는 파일에 바로 저장할 수 없어서 새 파일로 내려받았어요. 앞으로는 새로 받은 파일을 여세요.', 'warn');
  }

  // 위쪽 버튼: 온라인 사이트에서는 '내려받기', 내려받은 파일에서는 '저장'
  function fileButton() {
    if (IS_LOCAL_FILE) { saveToFile(); return; }
    downloadFile(buildSavedHtml(), DOWNLOAD_NAME);
    toast('지금 설정을 담은 파일을 내려받았어요. 그 파일을 열면 인터넷 없이 쓸 수 있고, 고친 설정이 파일 안에 저장돼요.', 'ok');
  }

  // 내려받은 파일에서 저장하지 않은 변경이 있으면 버튼에 점 표시
  let unsaved = false;
  function markUnsaved() {
    if (!IS_LOCAL_FILE || unsaved) return;
    unsaved = true;
    document.getElementById('fileBtnLabel').textContent = ' 저장 •';
  }
  function markSaved() {
    unsaved = false;
    if (IS_LOCAL_FILE) document.getElementById('fileBtnLabel').textContent = ' 저장';
  }
  if (IS_LOCAL_FILE) {
    const dl = document.getElementById('settingsDownloadBtn');
    dl.textContent = '💾 파일에 저장';
    dl.dataset.tip = '설정을 이 파일에 저장합니다. 다음에 이 파일을 열면 저장한 설정으로 시작합니다.';
    document.getElementById('settingsApplyBtn').dataset.tip = '수정한 값은 새로고침(F5) 후 초기화됩니다. 필요한 경우 파일에 저장하세요.';
    document.getElementById('fileBtnIcon').textContent = '💾';
    document.getElementById('fileBtnLabel').textContent = ' 저장';
    document.getElementById('fileBtn').title = '지금 설정(프리셋·논제·팀 이름)을 이 파일에 저장';
  }

  // 페이지를 떠나기 전에 확인: 토론이 진행 중일 때(새로고침·탭 닫기·뒤로 가기 실수 방지),
  // 내려받은 파일에서 저장하지 않은 설정이 있을 때
  window.addEventListener('beforeunload', e => {
    if (debateInProgress() || (IS_LOCAL_FILE && unsaved)) { e.preventDefault(); e.returnValue = ''; }
  });

  // 토론이 시작된 뒤 마지막 순서가 끝나기 전까지 (대기·일시정지 포함)
  function debateInProgress() {
    return currentStage >= 0 && !(currentStage === stages.length - 1 && timeLeft <= 0);
  }

  // ========== 화면 꺼짐 방지 ==========
  // 토론이 진행되는 동안에는 입력이 없어도 화면이 어두워지거나 꺼지지 않게 함 (브라우저의 Screen Wake Lock)
  // 다른 탭으로 가거나 창을 내리면 브라우저가 알아서 풀고, 돌아오면 다시 켬. 지원하지 않는 브라우저에서는 아무 일도 안 함
  let wakeLock = null, wakeBusy = false, wakeRetryAt = 0;
  function wantWakeLock() {
    return debateInProgress() && document.visibilityState === 'visible';
  }
  async function updateWakeLock() {
    if (!('wakeLock' in navigator) || wakeBusy) return;
    const want = wantWakeLock();
    if (want === !!wakeLock) return;
    if (want && Date.now() < wakeRetryAt) return;   // 거절된 직후에는 30초 쉬었다가 다시 시도
    wakeBusy = true;
    let refused = false;
    try {
      if (want) {
        const lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
        wakeLock = lock;
      } else {
        const lock = wakeLock; wakeLock = null;
        await lock.release();
      }
    } catch (e) {
      // 배터리 부족 등으로 브라우저가 거절한 경우: 타이머는 그대로 쓰고 나중에 다시 시도
      if (want) { wakeLock = null; refused = true; wakeRetryAt = Date.now() + 30000; }
    } finally {
      wakeBusy = false;
    }
    // 기다리는 사이에 토론 상태가 바뀌었으면 한 번 더 맞춤
    if (!refused && wantWakeLock() !== !!wakeLock) setTimeout(updateWakeLock, 0);
  }
  document.addEventListener('visibilitychange', updateWakeLock);

  // ========== 논제 고르기 ==========
  const TOPICS = [
    '돈으로 행복을 살 수 있다',
    '인공지능의 창작물도 예술성이 있다',
    '능력에 따른 분배는 정의롭다',
    '유전자 편집 기술을 인간의 능력 강화에 사용해도 된다',
    '16세 미만 청소년의 SNS 사용을 불법화해야 한다',
    '사형 집행을 재개해야 한다',
  ];

  function renderTopicMenu() {
    const menu = document.getElementById('topicMenu');
    const cur = document.getElementById('topicInput').value.trim();
    const matched = TOPICS.indexOf(cur);
    menu.textContent = '';
    const addOption = (numText, label, extraClass, active, onPick) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'topic-option' + (extraClass ? ' ' + extraClass : '') + (active ? ' active' : '');
      b.setAttribute('role', 'menuitem');
      const n = document.createElement('span'); n.className = 'opt-num'; n.textContent = numText;
      const t = document.createElement('span'); t.textContent = label;
      const c = document.createElement('span'); c.className = 'opt-check'; c.textContent = '✓';
      b.append(n, t, c);
      b.onclick = onPick;
      menu.appendChild(b);
    };
    TOPICS.forEach((topic, i) => addOption(String(i + 1), topic, '', i === matched, () => pickTopic(topic)));
    addOption('✎', '직접 입력', 'custom', matched < 0 && cur !== '', () => pickTopic(null));
  }

  function toggleTopicMenu(force) {
    const menu = document.getElementById('topicMenu');
    const open = typeof force === 'boolean' ? force : !menu.classList.contains('show');
    if (open) renderTopicMenu();
    menu.classList.toggle('show', open);
    document.getElementById('topicPickBtn').setAttribute('aria-expanded', String(open));
  }

  // topic: 고른 논제 문장 / null이면 '직접 입력' (칸을 비우고 바로 타이핑할 수 있게)
  function pickTopic(topic) {
    const input = document.getElementById('topicInput');
    toggleTopicMenu(false);
    if (topic === null) {
      input.value = '';
      fitTopic();
      input.focus();
    } else {
      input.value = topic;   // 고른 뒤에도 칸에서 자유롭게 고칠 수 있음
      fitTopic();
      if (document.activeElement) document.activeElement.blur();   // Space로 바로 시작할 수 있게
    }
    if (currentStage < 0) showOpening();
    markUnsaved();
  }

  // 논제가 길어 칸을 넘치면 글자 크기를 줄여 한 줄에 다 보이게 (최대 60%까지)
  const topicMeasure = document.createElement('canvas').getContext('2d');
  function fitTopic() {
    const el = document.getElementById('topicInput');
    el.style.fontSize = '';
    const cs = getComputedStyle(el);
    const base = parseFloat(cs.fontSize);
    const text = el.value || el.placeholder;
    topicMeasure.font = `${cs.fontWeight} ${base}px ${cs.fontFamily}`;
    const w = topicMeasure.measureText(text).width;
    const avail = el.clientWidth - 12;
    if (avail > 0 && w > avail) el.style.fontSize = Math.max(base * avail / w, base * 0.6) + 'px';
  }

  // 메뉴 바깥을 누르면 닫기
  document.addEventListener('click', (e) => {
    if (!document.getElementById('topicMenu').classList.contains('show')) return;
    if (!document.getElementById('topicPicker').contains(e.target)) toggleTopicMenu(false);
  });
  window.addEventListener('resize', fitTopic);
  // 글꼴이 늦게 도착하면 글자 폭이 바뀌므로 논제 크기를 다시 맞추고,
  // Pretendard를 실제로 불러왔는지 표시 (불러오지 못했으면 기기 기본 글꼴 그대로)
  function onFontsLoaded() {
    try {
      for (const f of document.fonts) {
        if (/Pretendard/.test(f.family) && f.status === 'loaded') { document.documentElement.classList.add('pt-font'); break; }
      }
    } catch (e) {}
    fitTopic();
  }
  if (document.fonts) {
    document.fonts.ready.then(onFontsLoaded);
    document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', onFontsLoaded);
  }

  // ========== 키보드 ==========
  document.addEventListener('keydown', (e) => {
    // 확인 창이 열려 있으면 Esc로 취소만 (Enter·Space는 선택된 버튼을 누름)
    if (isConfirmOpen()) {
      if (e.code === 'Escape') { e.preventDefault(); closeConfirm(false); }
      return;
    }
    // 설정 창이 열려 있으면 Esc = 취소 (다른 단축키는 막음)
    if (document.getElementById('settingsModal').classList.contains('show')) {
      if (e.code === 'Escape') { e.preventDefault(); closeSettings(); }
      return;
    }
    // 논제 메뉴가 열려 있으면 Esc로 닫기만 하고 다른 단축키는 막음
    if (document.getElementById('topicMenu').classList.contains('show')) {
      if (e.code === 'Escape') { e.preventDefault(); toggleTopicMenu(false); document.getElementById('topicPickBtn').focus(); }
      return;
    }
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
      if (e.target.id === 'topicInput' && e.code === 'Enter') e.target.blur();   // Enter로 입력 마치기
      return;
    }
    // 키를 누르고 있어서 저절로 반복되는 입력은 무시 (→를 누르고 있으면 여러 차례를 건너뛰던 문제)
    if (e.repeat && ['Space', 'ArrowRight', 'ArrowLeft', 'KeyF'].includes(e.code)) { e.preventDefault(); return; }
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); nextStage(); }
    else if (e.code === 'ArrowLeft') { e.preventDefault(); prevStage(); }
    else if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); toggleFullscreen(); }
  });
  
  // 팀 이름을 고치면 '○○팀 발언' 표시도 바로 반영
  ['proName', 'conName'].forEach(id => document.getElementById(id).addEventListener('input', () => { updateDisplay(); markUnsaved(); }));

  // 논제를 고치면 시작 전 멘트도 바로 바뀜
  document.getElementById('topicInput').addEventListener('input', () => {
    fitTopic();
    if (currentStage < 0) showOpening();
    markUnsaved();
  });

  // ========== 초기화 ==========
  if (SAVED) {
    if (typeof SAVED.topic === 'string') document.getElementById('topicInput').value = SAVED.topic;
    if (typeof SAVED.proName === 'string') document.getElementById('proName').value = SAVED.proName;
    if (typeof SAVED.conName === 'string') document.getElementById('conName').value = SAVED.conName;
  }
  buildProgress();
  updateDisplay();
  updateFormatToggle();
  showOpening();
  fitTopic();
</script>

</body></html>
